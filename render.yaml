services:
  - type: web
    name: smart-student-planner
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn smart_student_planner.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
